<!DOCTYPE html>
<html>
<head>
    <title>InheritiGuard - Access Blocked</title>
    <meta http-equiv="Content-Security-Policy" content="script-src 'self'">
    <style>
        :root {
            --primary-color: #2196F3;
            --danger-color: #ff4444;
            --text-color: #333;
            --bg-color: #f8f9fa;
            --card-shadow: 0 8px 24px rgba(0,0,0,0.1);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: var(--text-color);
        }

        .container {
            background-color: white;
            padding: 40px;
            border-radius: 16px;
            box-shadow: var(--card-shadow);
            max-width: 600px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .logo-container {
            margin-bottom: 30px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
        }

        .inheriti-logo {
            height: 40px;
            width: auto;
        }

        h1 {
            color: var(--danger-color);
            margin-bottom: 25px;
            font-size: 28px;
            font-weight: 600;
        }

        .blocked-url {
            background-color: var(--bg-color);
            padding: 15px;
            border-radius: 8px;
            margin: 25px 0;
            word-break: break-all;
            font-family: monospace;
            font-size: 14px;
            border: 1px solid #e0e0e0;
        }

        .message {
            color: #666;
            line-height: 1.8;
            font-size: 16px;
            margin: 25px 0;
        }

        .button {
            background-color: var(--primary-color);
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 25px;
            text-decoration: none;
            display: inline-block;
            font-weight: 500;
            transition: all 0.3s ease;
            box-shadow: 0 2px 8px rgba(33, 150, 243, 0.3);
        }

        .button:hover {
            background-color: #1976D2;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(33, 150, 243, 0.4);
        }

        .security-badge {
            position: absolute;
            top: 0;
            right: 0;
            background-color: var(--danger-color);
            color: white;
            padding: 8px 16px;
            font-size: 12px;
            font-weight: 500;
            border-bottom-left-radius: 8px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="security-badge">SECURITY ALERT</div>
        <div class="logo-container">
            <img src="images/inheriti_logo_full_color.png" alt="Inheriti Logo" class="inheriti-logo">
        </div>
        <h1>Access Blocked</h1>
        <div class="blocked-url" id="blockedUrl">
            <!-- URL will be inserted here -->
        </div>
        <p class="message">
            This website has been blocked by InheritiGuard to protect your privacy and security.
            For your safety, only trusted domains are allowed while protection is enabled.
        </p>
        <a href="https://inheriti.com" class="button" id="backButton">Return to Inheriti</a>
    </div>
    <script src="blocked.js"></script>
</body>
</html>
