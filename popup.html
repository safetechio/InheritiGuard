<!DOCTYPE html>
<html>
<head>
  <title>InheritiGuard</title>
  <style>
    body {
      width: 400px;
      padding: 15px 15px 48px;
      font-family: Arial, sans-serif;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
    .title {
      font-size: 20px;
      font-weight: bold;
      margin: 0;
    }
    .logo {
      height: 30px;
      width: auto;
    }
    .status {
      position: fixed;
      bottom: 10px;
      left: 10px;
      display: flex;
      align-items: center;
    }
    .status img {
      width: 20px;
      height: 20px;
      margin-right: 8px;
    }
    .status.enabled img {
      filter: none;
      opacity: 1;
    }
    .status.disabled img {
      filter: grayscale(1);
      opacity: 0.45;
    }
    .status.enabled #statusText {
      color: #1a73e8;
      font-weight: 600;
    }
    .status.disabled #statusText {
      color: #888;
      font-weight: 400;
    }
    .protection-control {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 15px;
    }
    .switch {
      position: relative;
      display: inline-block;
      width: 60px;
      height: 34px;
    }
    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }
    .slider {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: #ccc;
      transition: .4s;
      border-radius: 34px;
    }
    .slider:before {
      position: absolute;
      content: "";
      height: 26px;
      width: 26px;
      left: 4px;
      bottom: 4px;
      background-color: white;
      transition: .4s;
      border-radius: 50%;
    }
    input:checked + .slider {
      background-color: #2196F3;
    }
    input:checked + .slider:before {
      transform: translateX(26px);
    }
    .protection-status {
      font-size: 14px;
      margin: 0;
    }
    .blocked-sites {
      margin-top: 20px;
      max-height: 200px;
      overflow-y: auto;
    }
    .blocked-list {
      list-style: none;
      padding: 0;
      margin: 0;
    }
    .blocked-list li {
      padding: 8px;
      border-bottom: 1px solid #eee;
      font-size: 14px;
    }
    .blocked-list li:last-child {
      border-bottom: none;
    }
    .blocked-time {
      color: #666;
      font-size: 12px;
      margin-left: 10px;
    }
    .version-link {
      position: fixed;
      bottom: 12px;
      right: 10px;
      font-size: 11px;
      color: #666;
      text-decoration: none;
    }
    .version-link:hover {
      text-decoration: underline;
      color: #007bff;
    }
    .protection-toggles {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 20px;
    }
    
    .toggle-row {
      display: flex;
      align-items: center;
      gap: 10px;
      position: relative;
    }
    
    .toggle-label {
      font-size: 14px;
      color: #666;
    }
    .option-hint {
      min-height: 52px;
      margin: 4px 0 0;
      padding: 8px 10px;
      background: #f4f6f8;
      border: 1px solid #e6e8eb;
      border-radius: 6px;
      color: #555;
      font-size: 12px;
      line-height: 1.45;
    }
    .secure-leave {
      width: 100%;
      margin-top: 8px;
      padding: 10px 12px;
      border: none;
      border-radius: 8px;
      background-color: #c62828;
      color: white;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
    .idle-minutes {
      width: 56px;
      padding: 4px 6px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 13px;
    }
    .idle-minutes:disabled {
      opacity: 0.5;
    }
    .secure-leave {
      width: 100%;
      margin-top: 8px;
      padding: 10px 12px;
      border: none;
      border-radius: 8px;
      background-color: #2196F3;
      color: white;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
    .secure-leave:hover {
      background-color: #1976D2;
    }
    .secure-leave:disabled {
      opacity: 0.6;
      cursor: default;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1 class="title">InheritiGuard</h1>
    <img src="images/inheriti_logo_full_color.png" alt="Inheriti Logo" class="logo">
  </div>
  
  <div class="protection-toggles">
    <div class="toggle-row" data-tip="When on, InheritiGuard only allows navigation to trusted Inheriti domains and required login providers. Other sites are blocked.">
      <label class="switch">
        <input type="checkbox" id="enableToggle" checked>
        <span class="slider"></span>
      </label>
      <span class="protection-status">Protection: <span id="enabledText">Enabled</span></span>
    </div>
    
    <div class="toggle-row" data-tip="Blocks camera, microphone, location, notifications, and service workers so pages cannot use those browser features while protection is on.">
      <label class="switch">
        <input type="checkbox" id="apiBlockToggle" checked>
        <span class="slider"></span>
      </label>
      <span class="toggle-label">Block Sensitive APIs</span>
    </div>

    <div class="toggle-row" data-tip="Stops Inheriti URLs and data just copied from Inheriti from being pasted or read on untrusted sites. Clipboard still works on Inheriti itself.">
      <label class="switch">
        <input type="checkbox" id="clipboardGuardToggle" checked>
        <span class="slider"></span>
      </label>
      <span class="toggle-label">Clipboard leak guard</span>
    </div>

    <div class="toggle-row" data-tip="After this many minutes idle or when the computer is locked, InheritiGuard logs you off the Inheriti ecosystem: it closes those tabs and clears session data.">
      <label class="switch">
        <input type="checkbox" id="idleLockToggle" checked>
        <span class="slider"></span>
      </label>
      <span class="toggle-label">Idle lock</span>
      <input type="number" id="idleLockMinutes" class="idle-minutes" min="1" max="120" value="10">
      <span class="toggle-label">min</span>
    </div>

    <div class="toggle-row" data-tip="Blocks risky files from Inheriti sessions, such as HTML, SVG, scripts, and executables, and stops fake inline login pages (data/blob documents).">
      <label class="switch">
        <input type="checkbox" id="downloadTrapToggle" checked>
        <span class="slider"></span>
      </label>
      <span class="toggle-label">Download / file trap</span>
    </div>

    <p class="option-hint" id="optionHint">Hover an option to see what it does.</p>

    <button type="button" id="secureLeaveButton" class="secure-leave" data-tip="Logs you off the Inheriti ecosystem: closes Inheriti, SafeTech, and SafeKey tabs and clears cookies and site data for those sessions.">Secure logoff</button>
  </div>

  <div class="blocked-sites">
    <h3></h3>
    <ul id="blockedList" class="blocked-list">
      <!-- Blocked sites will be inserted here -->
    </ul>
  </div>

  <div class="status disabled" id="statusRow">
    <img src="icons/icon32.png" alt="InheritiGuard" id="statusIcon">
    <span id="statusText">Protection is disabled</span>
  </div>
  <a href="#" id="versionLink" class="version-link">v1.0.5</a>

  <script src="popup.js"></script>
</body>
</html>
